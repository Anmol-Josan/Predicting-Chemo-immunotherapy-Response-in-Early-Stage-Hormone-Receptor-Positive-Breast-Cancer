name: Push revision pipeline to Kaggle

on:
  push:
    branches:
      - main  # Trigger workflow whenever you push to main

jobs:
  run-kaggle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle API
        run: python -m pip install --upgrade kaggle

      - name: Validate Kaggle entrypoint
        run: |
          test -f run_revision_pipeline.py
          python -m py_compile run_revision_pipeline.py
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("kernel-metadata.json").read_text())
          assert metadata["code_file"] == "run_revision_pipeline.py"
          assert metadata["kernel_type"] == "script"
          PY

      - name: Push and run code on Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # The script detects Kaggle and downloads GSE300475 when no input mount exists.
          kaggle kernels push -p .
