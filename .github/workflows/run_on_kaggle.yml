name: Push revision pipeline to Kaggle

on:
  push:
    branches:
      - main  # Trigger workflow whenever you push to main

jobs:
  run-kaggle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle API
        run: python -m pip install --upgrade "kaggle>=1.8.3"

      - name: Prepare compact Kaggle resume payload
        run: |
          test -f results.zip
          # The original archive also contains ~1.2 GB of downloaded GEO data.
          # Kaggle can fetch that data in seconds; only the completed model and
          # preprocessor artifacts are needed to resume training.
          unzip -oq results.zip 'results/*' -d .
          mv results.zip /tmp/results-full.zip
          zip -qr results.zip results

      - name: Validate Kaggle entrypoint
        run: |
          test -f run_revision_pipeline.py
          test -f results.zip
          test -d results/models
          test "$(find results/models -type f | wc -l)" -ge 12
          # Catch an unhydrated Git-LFS pointer before invoking the Kaggle API.
          test "$(stat -c%s results.zip)" -gt 1000000
          python -m py_compile run_revision_pipeline.py
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("kernel-metadata.json").read_text())
          assert metadata["code_file"] == "run_revision_pipeline.py"
          assert metadata["kernel_type"] == "script"
          assert metadata["enable_gpu"] == "false"
          PY

      - name: Push and run code on Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # results.zip is included in the kernel package and auto-detected by the script.
          kaggle kernels push -p .
