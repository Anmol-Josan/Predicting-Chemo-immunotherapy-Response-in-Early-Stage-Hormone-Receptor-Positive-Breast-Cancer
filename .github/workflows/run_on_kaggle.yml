name: Push revision pipeline to Kaggle

on:
  push:
    branches:
      - main  # Trigger workflow whenever you push to main

jobs:
  run-kaggle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
        with:
          # The historical repository contains multi-gigabyte LFS archives.
          # The current pipeline can download the public GEO inputs itself.
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Kaggle API
        run: python -m pip install --upgrade "kaggle>=1.8.3"

      - name: Prepare clean Kaggle kernel package
        run: |
          mkdir -p kaggle-kernel
          cp run_revision_pipeline.py kernel-metadata.json kaggle-kernel/
          # Keep the upload intentionally source-only. The pipeline detects the
          # Kaggle runtime, downloads GSE300475, and writes fresh result artifacts.
          test ! -e kaggle-kernel/results.zip
          test -z "$(find kaggle-kernel -type f -size +20M -print -quit)"

      - name: Validate Kaggle entrypoint
        run: |
          test -f kaggle-kernel/run_revision_pipeline.py
          test -f kaggle-kernel/kernel-metadata.json
          python -m py_compile kaggle-kernel/run_revision_pipeline.py
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("kaggle-kernel/kernel-metadata.json").read_text())
          assert metadata["code_file"] == "run_revision_pipeline.py"
          assert metadata["kernel_type"] == "script"
          assert metadata["enable_gpu"] == "false"
          PY

      - name: Push and run code on Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p kaggle-kernel
